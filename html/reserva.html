<!DOCTYPE html>
<html lang="ca">

<head>
    <meta charset="UTF-8">
    <title>Reserva | Dogstar Games Store</title>
    <meta name="description" content="Formulari de reserva de videojocs a Dogstar Games Store">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta property="og:title" content="Dogstar Games Store">
    <link rel="stylesheet" href="../css/estils.css">
    <script src="../js/reserva.js" defer></script>
    <script src="../js/tema.js" defer></script>
</head>

<body>
    <header class="site-header">
        <a href="index.html" class="logo" aria-label="Anar al catàleg de videojocs">
            <img src="../img/logo dogstar.png" alt="Logo Dogstar Games Store" width="40" height="40">
            <h1>DOGSTAR GAMES STORE</h1>
        </a>
        <nav class="main-nav">
            <a href="index.html">Catàleg</a>
            <a href="fitxa.html">Fitxa</a>
            <a href="reserva.html">Reserva</a>
            <button id="tema-toggle" class="theme-toggle" aria-label="Canviar tema">☀️</button>
        </nav>
    </header>

    <main id="reserva">
        <h2>Formulari de reserva</h2>

        <form id="formulari-reserva" action="#" method="post" novalidate>
            <label for="nom">Nom complet *</label><br>
            <input type="text" id="nom" name="nom" autocomplete="name" required><br><br>

            <label for="email">Correu electrònic *</label><br>
            <input type="email" id="email" name="email" autocomplete="email" required><br><br>

            <label for="telefon">Telèfon</label><br>
            <input type="tel" id="telefon" name="telefon" autocomplete="tel"><br><br>

            <label for="joc">Joc a reservar *</label><br>
            <select id="joc" name="joc" required>
                <option value="">-- Selecciona un joc --</option>
                <option value="GTA 1">GTA 1</option>
                <option value="GTA 2">GTA 2</option>
                <option value="GTA III">GTA III</option>
                <option value="GTA Vice City">GTA Vice City</option>
                <option value="GTA San Andreas">GTA San Andreas</option>
                <option value="GTA Advance">GTA Advance</option>
                <option value="GTA IV">GTA IV</option>
                <option value="GTA Chinatown Wars">GTA Chinatown Wars</option>
                <option value="GTA V">GTA V</option>
                <option value="GTA VI">GTA VI</option>
            </select><br><br>

            <label for="quantitat">Quantitat</label><br>
            <input type="number" id="quantitat" name="quantitat" min="1" max="10" value="1"><br><br>

            <label for="metode">Mètode de pagament *</label><br>
            <select id="metode" name="metode">
                <option value="">-- Selecciona un mètode --</option>
                <option value="targeta">Targeta</option>
                <option value="paypal">PayPal</option>
                <option value="bizum">Bizum</option>
                <option value="transferencia">Transferència</option>
            </select><br><br>

            <label for="comentaris">Comentaris *</label><br>
            <textarea id="comentaris" name="comentaris" rows="5" cols="40"
                placeholder="Escriu aquí les teves observacions..."></textarea>
            <p id="comptador-comentaris"></p>

            <label for="condicions">
                <input type="checkbox" id="condicions" name="condicions" required>
                Accepto les condicions de reserva *
            </label><br><br>

            <button type="submit">Enviar reserva</button>
        </form>

        <div id="resum"></div>
    </main>

    <footer>
        <p>&copy; 2026 Dogstar Games Store. Tots els drets reservats.</p>
    </footer>
</body>

</html>
